name: Sync MD from Gitee

on:
  # 定时同步：每天 UTC 4点和18点执行
  schedule:
    - cron: '0 4,18 * * *' 
  # 允许手动点击按钮触发
  workflow_dispatch: 

jobs:
  sync-markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整历史以便正确合并

      - name: Clone Gitee Repo & Copy MD Files
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          # 🛑 安全检查：如果 Token 为空，立即报错停止，防止 Git 尝试交互登录
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::GITEE_TOKEN is empty! Please verify it exists in Repository Secrets (not Environment Secrets)."
            exit 1
          fi

          echo "✅ Token loaded successfully, starting clone..."
          
          # 克隆私有仓库
          git clone --depth 1 "https://freeman535:${GITEE_TOKEN}@gitee.com/freeman535/vue-element-admin.git" /tmp/gitee-repo
          # git clone --depth 1 "https://${GITEE_TOKEN}@gitee.com/freeman535/vue-element-admin.git" /tmp/gitee-repo
          
          # 创建目标目录并复制文件（已修复路径嵌套问题）
          mkdir -p ./docs/from-gitee
          cd /tmp/gitee-repo
          find . -name "*.md" -exec cp --parents {} "${GITHUB_WORKSPACE}/docs/from-gitee/" \;
          cd "${GITHUB_WORKSPACE}"
          
          # 清理临时目录
          rm -rf /tmp/gitee-repo

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 检查是否有变更
          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "chore: sync markdown files from Gitee [skip ci]"
            git push
          else
            echo "No changes detected, skipping commit."
          fi
